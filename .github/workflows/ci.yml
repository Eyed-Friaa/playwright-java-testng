name: CI — Playwright Java TestNG

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Nightly regression at 02:00 UTC (03:00 Berlin)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options: [ smoke, regression, api ]
      browser:
        description: 'Browser'
        required: true
        default: 'chromium'
        type: choice
        options: [ chromium, firefox, webkit ]
      headless:
        description: 'Run headless'
        required: true
        default: 'true'
        type: choice
        options: [ 'true', 'false' ]

# Least-privilege default; publish-report elevates as needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref (PR pushes, rapid main pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  SUITE: ${{ github.event.inputs.suite || 'smoke' }}
  BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
  HEADLESS: ${{ github.event.inputs.headless || 'true' }}
  # Bump alongside <playwright.version> in pom.xml — cache key depends on it.
  PLAYWRIGHT_VERSION: '1.44.0'

jobs:

  # ─── Push / PR / manual run ─────────────────────────────────────────────────
  test:
    name: "${{ github.event.inputs.suite || 'smoke' }} | ${{ github.event.inputs.browser || 'chromium' }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: github.event_name != 'schedule'

    # Expose the resolved suite/browser so publish-report doesn't have to
    # re-derive them from event context (where inputs are null on push).
    outputs:
      suite: ${{ env.SUITE }}
      browser: ${{ env.BROWSER }}

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-${{ env.BROWSER }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-

      - name: Install Playwright browsers
        # Always run so system deps (--with-deps) are present even on cache hit;
        # the browser binaries themselves are a no-op when already cached.
        run: mvn -B exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps ${{ env.BROWSER }}" --no-transfer-progress

      - name: Run tests
        run: |
          mvn -B test \
            -P${{ env.SUITE }} \
            -Dbrowser=${{ env.BROWSER }} \
            -Dheadless=${{ env.HEADLESS }} \
            -Dbase.url=${{ secrets.BASE_URL || 'https://www.saucedemo.com' }} \
            -Dapi.base.url=${{ secrets.API_BASE_URL || 'https://jsonplaceholder.typicode.com' }} \
            -Dretry.count=1 \
            --no-transfer-progress

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report --no-transfer-progress

      - name: Upload Allure results (raw)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ env.SUITE }}-${{ env.BROWSER }}
          path: target/allure-results/
          retention-days: 30

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ env.SUITE }}-${{ env.BROWSER }}
          path: target/site/allure-maven-plugin/
          retention-days: 30

      - name: Upload failure artifacts (screenshots + traces + videos)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-artifacts-${{ env.SUITE }}-${{ github.run_number }}
          path: |
            target/screenshots/
            target/traces/
            target/videos/
          retention-days: 7

  # ─── Publish Allure to GitHub Pages (push to main only) ─────────────────────
  publish-report:
    name: Publish Allure to GitHub Pages
    needs: test
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Allure HTML report
        uses: actions/download-artifact@v8
        with:
          # Use resolved values from the test job (event.inputs is null on push).
          name: allure-report-${{ needs.test.outputs.suite }}-${{ needs.test.outputs.browser }}
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          # Preserve history: previous runs stay under history/<run_number>/,
          # latest report remains at the site root.
          keep_files: true

  # ─── Nightly full regression (schedule only) ────────────────────────────────
  # Matrix on browser × shard so total wall-clock ≈ (regression / SHARD_TOTAL).
  # ShardInterceptor keys methods by fully-qualified name, so re-running one
  # shard hits the same tests every time — helpful for reproducing flakes.
  nightly-regression:
    name: "Nightly — ${{ matrix.browser }} shard ${{ matrix.shard }}/4"
    runs-on: ubuntu-22.04
    if: github.event_name == 'schedule'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [ chromium, firefox, webkit ]
        shard:   [ 1, 2, 3, 4 ]

    env:
      SHARD_TOTAL: 4

    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-${{ matrix.browser }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-

      - name: Install Playwright browsers
        run: mvn -B exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps ${{ matrix.browser }}" --no-transfer-progress

      - name: Run regression shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }} on ${{ matrix.browser }}
        # ShardInterceptor uses a 0-based index; matrix values are 1-based for readability.
        run: |
          mvn -B test -Pregression \
            -Dbrowser=${{ matrix.browser }} \
            -Dheadless=true \
            -Dshard.total=${{ env.SHARD_TOTAL }} \
            -Dshard.index=$(( ${{ matrix.shard }} - 1 )) \
            --no-transfer-progress

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-results-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: target/allure-results/
          retention-days: 14

  # Merge every shard's Allure results into one unified per-run artifact so the
  # report shows the full regression across browsers, not one shard slice.
  nightly-merge:
    name: Merge nightly Allure results
    needs: nightly-regression
    runs-on: ubuntu-22.04
    if: github.event_name == 'schedule' && always()
    steps:

      - name: Download all shard results
        uses: actions/download-artifact@v8
        with:
          pattern: nightly-results-*
          path: merged
          merge-multiple: true

      - name: Upload merged results
        uses: actions/upload-artifact@v7
        with:
          name: nightly-results-merged
          path: merged/
          retention-days: 30
