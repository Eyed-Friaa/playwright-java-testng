# ═══════════════════════════════════════════════
# Framework Configuration
# Override any value via env var or system property
# e.g. -Dbrowser=firefox -Dheadless=false
# ═══════════════════════════════════════════════

# Target application
base.url=https://www.saucedemo.com
api.base.url=https://jsonplaceholder.typicode.com

# Browser settings
browser=chromium
headless=true
slow.mo=0

# Timeouts (ms)
default.timeout=30000

# Viewport
viewport.width=1920
viewport.height=1080

# Failure artifacts
screenshot.on.failure=true
video.on.failure=false
trace.on.failure=true

# Retry
retry.count=1

# Parallel
parallel.threads=4
